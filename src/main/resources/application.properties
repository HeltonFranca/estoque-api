spring.application.name=estoque-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estoque}
spring.datasource.username=${DB_USERNAME:estoque_app}
spring.datasource.password=${DB_PASSWORD:estoque123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=Estoque API
info.app.description=estudo java springboot

jwt.secret=${JWT_SECRET:estoque-api-chave-jwt-local-dev-2026-segura}
jwt.expiration-ms=3600000

app.seed.enabled=${APP_SEED_ENABLED:false}
